[project]
name = "brl-eur-monitor"
version = "0.1.0"
description = "Daily BRL-EUR corridor record from ECB and Banco Central do Brasil"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests>=2.32"]

[project.scripts]
monitor = "pipeline.run:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
]
ignore = [
    "B904",  # raising without from inside except: not relevant here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
